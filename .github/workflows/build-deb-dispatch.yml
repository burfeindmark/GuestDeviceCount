name: Build Debian package (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the .deb (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

jobs:
  build_deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare package layout
      run: |
        set -e
        PKGDIR=package
        rm -rf $PKGDIR
        mkdir -p $PKGDIR/opt/guest-device-counter
        rsync -a --exclude='.git' . $PKGDIR/opt/guest-device-counter/
        VERSION=${{ github.event.inputs.version }}
        mkdir -p $PKGDIR/DEBIAN
        cat > $PKGDIR/DEBIAN/control <<EOF
Package: guest-device-counter
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: all
Maintainer: GitHub Actions <actions@github.com>
Description: Guest Device Counter for venue guest networks
 A service that scans the guest network, records device activity, and
 generates PDF analytics reports.
EOF
        # Add a postinst script to perform final install steps when the package is installed
        cat > $PKGDIR/DEBIAN/postinst <<'POSTINST'
#!/bin/bash
set -e
# Run bundled installer if present (already installed to /opt by the package)
if [ -x /opt/guest-device-counter/install.sh ]; then
  /bin/bash /opt/guest-device-counter/install.sh || true
fi
# Reload systemd and enable service if available
if command -v systemctl >/dev/null 2>&1; then
  systemctl daemon-reload || true
  systemctl enable guest-device-counter.service || true
fi
POSTINST
        chmod 755 $PKGDIR/DEBIAN/postinst
        chmod -R 755 $PKGDIR/opt/guest-device-counter

    - name: Install packaging tools
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends dpkg-dev rsync

    - name: Build .deb
      run: |
        set -e
        dpkg-deb --build package
        mv package.deb guest-device-counter_${{ github.event.inputs.version }}_all.deb
        ls -lh guest-device-counter_${{ github.event.inputs.version }}_all.deb

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: guest-device-counter-deb
        path: guest-device-counter_${{ github.event.inputs.version }}_all.deb
